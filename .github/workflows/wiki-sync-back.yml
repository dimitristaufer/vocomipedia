name: Wiki Sync Back

on:
  workflow_dispatch:
    inputs:
      process_all_decks:
        description: "Process every deck from catalog/packs.yaml"
        type: boolean
        required: false
        default: false
      deck_codes:
        description: "Space-separated deck codes to pull, e.g. ja_n5 de_a2. Ignored when process_all_decks is true."
        required: false
        default: "ja_n5"
      export_source:
        description: "Write accepted changes back into Vocomipedia canonical data"
        type: boolean
        required: false
        default: true
      create_pr:
        description: "Create a PR in this repo when canonical data changes"
        type: boolean
        required: false
        default: true

concurrency:
  group: vocomipedia-production-wiki-sync-back
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      requested_deck_codes: ${{ steps.plan.outputs.requested_deck_codes }}
      requested_decks_json: ${{ steps.plan.outputs.requested_decks_json }}
    steps:
      - name: Checkout Vocomipedia
        uses: actions/checkout@v6
        with:
          path: vocomipedia
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: vocomipedia/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r vocomipedia/requirements.txt
      - name: Resolve requested decks
        id: plan
        env:
          REQUESTED_DECK_INPUT: ${{ inputs.deck_codes }}
        run: |
          cd vocomipedia
          if [ "${{ inputs.process_all_decks }}" = "true" ]; then
            REQUESTED_DECK_CODES="$(python tools/catalog_decks.py --all)"
            REQUESTED_DECKS_JSON="$(python tools/catalog_decks.py --all --format json)"
          else
            REQUESTED_DECK_CODES="$(python tools/catalog_decks.py --deck-string "$REQUESTED_DECK_INPUT")"
            REQUESTED_DECKS_JSON="$(python tools/catalog_decks.py --deck-string "$REQUESTED_DECK_INPUT" --format json)"
          fi
          echo "requested_deck_codes=$REQUESTED_DECK_CODES" >> "$GITHUB_OUTPUT"
          echo "requested_decks_json=$REQUESTED_DECKS_JSON" >> "$GITHUB_OUTPUT"
          echo "Requested decks: $REQUESTED_DECK_CODES"

  sync-back-deck:
    needs: plan
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 330
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        deck: ${{ fromJson(needs.plan.outputs.requested_decks_json) }}
    steps:
      - name: Checkout Vocomipedia
        uses: actions/checkout@v6
        with:
          path: vocomipedia
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: vocomipedia/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r vocomipedia/requirements.txt
      - name: Pull approved wiki edits and export source changes
        env:
          DECK_CODE: ${{ matrix.deck }}
          MEDIAWIKI_API_URL: ${{ secrets.MEDIAWIKI_API_URL }}
        run: |
          test -n "$MEDIAWIKI_API_URL"
          EXPORT_ARG=""
          if [ "${{ inputs.export_source }}" = "true" ]; then
            EXPORT_ARG="--export-source"
          fi
          cd vocomipedia
          python tools/wiki_sync_back.py \
            --decks "$DECK_CODE" \
            --api-url "$MEDIAWIKI_API_URL" \
            --work-root "tmp/wiki-sync-back-data/$DECK_CODE" \
            --pulled-root "tmp/wiki-pull/$DECK_CODE" \
            --reports-dir "reports/wiki-sync-back/$DECK_CODE" \
            $EXPORT_ARG
      - name: Resolve exported deck path
        id: deck-path
        env:
          DECK_CODE: ${{ matrix.deck }}
        run: |
          cd vocomipedia
          DECK_DIR="$(python - "$DECK_CODE" <<'PY'
          import sys
          from pathlib import Path
          from common import load_pack_catalog, repo_root_from_tool
          from prepare_release_workspace import canonical_pack_dir

          root = repo_root_from_tool()
          code = sys.argv[1]
          catalog = load_pack_catalog(root / "catalog" / "packs.yaml")
          path = canonical_pack_dir(root, root / "data/languages", catalog[code], code)
          print("vocomipedia/" + path.relative_to(root).as_posix())
          PY
          )"
          echo "deck_dir=$DECK_DIR" >> "$GITHUB_OUTPUT"
          echo "Exported deck path: $DECK_DIR"
      - name: Upload per-deck sync result
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: vocomipedia-wiki-sync-back-${{ matrix.deck }}
          path: |
            ${{ steps.deck-path.outputs.deck_dir }}/**
            vocomipedia/reports/wiki-sync-back/${{ matrix.deck }}/**
          if-no-files-found: error

  aggregate:
    needs:
      - plan
      - sync-back-deck
    if: always() && needs.sync-back-deck.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Vocomipedia
        uses: actions/checkout@v6
        with:
          path: vocomipedia
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: vocomipedia/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r vocomipedia/requirements.txt
      - name: Download per-deck sync results
        uses: actions/download-artifact@v6
        with:
          pattern: vocomipedia-wiki-sync-back-*
          path: vocomipedia
          merge-multiple: true
      - name: Merge sync reports
        run: |
          cd vocomipedia
          if [ "${{ inputs.export_source }}" = "true" ]; then
            EXPORT_ARG="--export-source"
          else
            EXPORT_ARG=""
          fi
          python tools/merge_wiki_sync_reports.py \
            --reports-dir reports/wiki-sync-back \
            $EXPORT_ARG
      - name: Upload sync reports
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: vocomipedia-wiki-sync-back
          path: |
            vocomipedia/reports/wiki-sync-back/**
          if-no-files-found: ignore
      - name: Detect Vocomipedia canonical changes
        id: diff
        run: |
          cd vocomipedia
          if git diff --quiet -- data/languages; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Create Vocomipedia PR
        if: inputs.create_pr && steps.diff.outputs.changed == 'true'
        env:
          VOCOMIPEDIA_PR_TOKEN: ${{ secrets.VOCOMIPEDIA_PR_TOKEN }}
          GITHUB_TOKEN_FALLBACK: ${{ github.token }}
        run: |
          BRANCH="vocomipedia/wiki-sync-${{ github.run_id }}"
          cd vocomipedia
          git config user.name "vocomipedia-bot"
          git config user.email "vocomipedia-bot@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add data/languages
          git commit -m "Sync approved Vocomipedia edits"
          git push --force-with-lease origin "$BRANCH"

          if [ -n "${VOCOMIPEDIA_PR_TOKEN:-}" ]; then
            export GH_TOKEN="$VOCOMIPEDIA_PR_TOKEN"
            TOKEN_LABEL="VOCOMIPEDIA_PR_TOKEN"
          else
            export GH_TOKEN="$GITHUB_TOKEN_FALLBACK"
            TOKEN_LABEL="GITHUB_TOKEN"
          fi

          if gh pr create \
            --repo dimitristaufer/vocomipedia \
            --base main \
            --head "$BRANCH" \
            --title "Sync approved Vocomipedia edits" \
            --body-file reports/wiki-sync-back/summary.md; then
            exit 0
          fi

          {
            echo "### Wiki sync back"
            echo
            echo "Canonical changes were pushed to \`$BRANCH\`, but PR creation failed using \`$TOKEN_LABEL\`."
            echo
            echo "Open the PR manually:"
            echo
            echo "https://github.com/dimitristaufer/vocomipedia/compare/main...$BRANCH?expand=1"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "PR creation failed, but the sync branch was pushed: $BRANCH" >&2
